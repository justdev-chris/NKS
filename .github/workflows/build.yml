name: Build NKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          env ASSUME_ALWAYS_YES=yes pkg bootstrap
          pkg update
          pkg install -y git gcc make
          echo "✅ FreeBSD environment ready"
        run: |
          cd $GITHUB_WORKSPACE
          echo "🐾 Building NKS..."
          make all
          make image
          ls -la output/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nks-images
        path: output/
