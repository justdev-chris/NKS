name: Build NKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        pkg install -y gmake cmake git curl pkgconf
    
    - name: Build in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg install -y git gcc make
        run: |
          cd $GITHUB_WORKSPACE
          make all
          make image
          ls -la output/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nks-images
        path: output/
